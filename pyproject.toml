[project]
name = "a2a-mcp-project"
version = "0.1.0"
description = "Travel Agent App. Four autonomous AI agents (Flight, Hotel, Airbnb, Weather) communicating over the A2A protocol, backed by live data via MCP. Agent brains run on LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9", # brains import `create_agent` from langchain.agents
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "mcp>=1.13.1,<2",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
